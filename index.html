function responsibleRegisteredEmployees(){
  const allowed=new Set(responsibleRayonList().map(x=>String(x||'').trim().toUpperCase()));
  const source=Array.isArray(responsibleDashboardData?.employees)?responsibleDashboardData.employees:[];
  const unique=new Map();
  source.forEach(x=>{
    const email=String(x?.email||x?.employeeEmail||'').trim().toLowerCase();
    const rayon=String(x?.rayon||'').trim();
    if(!email||!rayon||!allowed.has(rayon.toUpperCase()))return;
    const previous=unique.get(email)||{};
    unique.set(email,{...previous,...x,email,rayon,
      name:String(x?.name||x?.employeeName||x?.display_name||[x?.prenom,x?.nom].filter(Boolean).join(' ')||email).trim(),
      service:String(x?.service||''),
      role:String(x?.role||x?.type||x?.fonction||'—'),
      createdAt:String(x?.created_at||x?.createdAt||x?.date_creation||x?.dateCreated||x?.created_on||'')
    });
  });
  return [...unique.values()];
}

function responsibleUserBalance(email){
  const {declarations,requests}=responsibleAllRows();
  const key=String(email||'').trim().toLowerCase();
  const rows=declarations.filter(x=>String(x?.employeeEmail||x?.employee_email||'').trim().toLowerCase()===key&&responsibleApprovedStatus(x?.status));
  const consumed={};
  requests.filter(x=>String(x?.employeeEmail||x?.employee_email||'').trim().toLowerCase()===key&&responsibleApprovedStatus(x?.status)).forEach(req=>{
    (Array.isArray(req?.dates)?req.dates:[]).forEach(d=>{const k=String(d||'').slice(0,10);if(k)consumed[k]=(consumed[k]||0)+1;});
  });
  let total=0;
  rows.forEach(x=>{
    const date=String(x?.date||'').slice(0,10);
    if(date&&consumed[date]){consumed[date]--;return;}
    total+=responsibleDaysForDeclaration(x);
  });
  return Math.round(total*100)/100;
}

function responsibleFormatCreatedDate(value){
  const v=String(value||'').trim();
  if(!v)return '—';
  const d=new Date(v);
  return Number.isNaN(d.getTime())?v:d.toLocaleDateString('fr-FR');
}

function renderResponsibleUsersPage(){
  const host=document.getElementById('responsibleUsersResults');
  if(!host)return;
  const selected=String(document.getElementById('responsibleUsersRayon')?.value||'').trim().toUpperCase();
  const users=responsibleRegisteredEmployees();
  const orderedRayons=Object.values(DEPARTEMENTS_RAYONS).flat();
  const visible=users.filter(x=>!selected||x.rayon.toUpperCase()===selected);
  const rank=new Map(orderedRayons.map((x,i)=>[String(x).toUpperCase(),i]));
  visible.sort((a,b)=>(rank.get(a.rayon.toUpperCase())??9999)-(rank.get(b.rayon.toUpperCase())??9999)||a.name.localeCompare(b.name,'fr'));
  const count=document.getElementById('responsibleUsersResultCount');
  if(count)count.textContent=`${visible.length} résultat${visible.length>1?'s':''}`;
  if(!visible.length){host.innerHTML='<div class="empty">Aucun utilisateur trouvé pour ce rayon.</div>';return;}
  const groups=[];
  if(selected){groups.push([visible[0].rayon,visible]);}
  else{
    const byRayon=new Map();
    visible.forEach(x=>{if(!byRayon.has(x.rayon))byRayon.set(x.rayon,[]);byRayon.get(x.rayon).push(x);});
    orderedRayons.forEach(r=>{const rows=byRayon.get(r);if(rows?.length)groups.push([r,rows]);});
    for(const [r,rows] of byRayon){if(!orderedRayons.some(x=>x.toUpperCase()===r.toUpperCase()))groups.push([r,rows]);}
  }
  host.innerHTML=groups.map(([rayon,rows])=>`<section style="margin-bottom:16px">
    <div class="sectionHead"><h3>${esc(rayon)}</h3><span>${rows.length} utilisateur${rows.length>1?'s':''}</span></div>
    ${rows.map(x=>`<div class="responsableResult">
      <div class="resultName">${esc(x.name||'—')}</div>
      <div class="resultInfo"><b>Role :</b> ${esc(x.role||'—')}<br><b>Service :</b> ${esc(x.service||'—')}<br><b>Email :</b> ${esc(x.email||'—')}<br><b>Solde :</b> ${formatRecoveryDays(responsibleUserBalance(x.email))} jour(s)</div>
    </div>`).join('')}
  </section>`).join('');
}

async function showResponsibleDeclarationsPage(filter){
  const titles={pending:'Déclarations en attente',approved:'Déclarations validées',all:'Historique des déclarations'};
  const subs={pending:'Validez ou refusez les déclarations reçues des employés de vos rayons.',approved:'Consultez les déclarations déjà validées.',all:'Consultez toutes les déclarations des employés de vos rayons.'};
  app.innerHTML=`<div class="pageCard"><button class="back" onclick="responsibleDashboard(currentResponsible,false)">Retour</button><h2 class="pageTitle">${titles[filter]||titles.all}</h2><p class="pageSub">${subs[filter]||subs.all}</p><div id="declarationList"><div class="empty">Chargement...</div></div></div>`;
  try{
    const d=responsibleDashboardData || await (async()=>{const email=currentResponsible.email||'';const [r,c]=await Promise.all([supabaseRpc('responsable_recovery_v2',{p_email:email}),supabaseRpc('responsable_declarations_all_v1',{p_email:email})]);return {...r,declarations:(Array.isArray(c?.declarations)?c.declarations:[]).map(x=>({...x,employeeName:x.employee_name||x.employee_email||'Employé',employeeEmail:x.employee_email||'',weekStart:x.week_from||'',weekEnd:x.week_to||'',timeFrom:x.time_from||'',timeTo:x.time_to||'',holidayName:x.holiday_name||''}))};})();
    responsibleDashboardData=d;
    let rows=Array.isArray(d?.declarations)?d.declarations.slice():[];
    if(filter==='pending')rows=rows.filter(x=>statusKind(x.status)==='pending');
    if(filter==='approved')rows=rows.filter(x=>statusKind(x.status)==='validated');
    rows.sort((a,b)=>responsibleOperationTimestamp(b)-responsibleOperationTimestamp(a));
    const box=document.getElementById('declarationList');
    if(!rows.length){box.innerHTML='<div class="empty">Aucune déclaration dans cette rubrique.</div>';return}
    box.innerHTML=rows.map(x=>{
      const type=String(x.type||'JOUR FÉRIÉ'),k=statusKind(x.status),pending=k==='pending';
      const week=(type==='HEURE SUPPLÉMENTAIRE'||type==='ROPOT')&&x.weekStart?`<div class="respWeek">SEMAINE : Du ${displayDateFr(x.weekStart)} au ${displayDateFr(x.weekEnd)}</div>`:'';
      const times=type==='HEURE SUPPLÉMENTAIRE'?`<div class="respTimes">HORAIRES : Du ${esc(formatTimeValue(x.timeFrom))} au ${esc(formatTimeValue(x.timeTo))} · ${Number(x.hours||0)} h = ${formatRecoveryDays(x.days)} jour(s)</div>`:'';
      const actions=pending?`<div class="respActions"><button class="btn approve" onclick="processDeclaration('${esc(x.id)}','APPROUVÉ')">Valider</button><button class="btn reject" onclick="processDeclaration('${esc(x.id)}','REFUSÉ')">Refuser</button></div>`:'';
      return `<div class="respDeclaration" data-declaration-id="${esc(x.id)}"><div class="requestHead"><div><div class="respName">${esc(x.employeeName||'Employé')}</div><div class="respMeta">${esc(x.service||'')} · ${esc(x.rayon||'')}</div></div><span class="badge ${k==='validated'?'valid':k==='rejected'?'rejected':'pending'}">${esc(x.status||'EN ATTENTE')}</span></div><div class="typeBadge">${esc(type)}</div><div class="respDate">${formatHolidayCard(x.date,x.holidayName)}</div>${week}${times}${actions}</div>`;
    }).join('');
  }catch(e){document.getElementById('declarationList').innerHTML='<div class="error">⚠️ '+esc(e.message||e)+'</div>';requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'smooth'}))}
}

async function showResponsibleHistory(){
  app.innerHTML=`<div class="pageCard"><button class="back" onclick="responsibleDashboard(currentResponsible,false)">Retour</button><h2 class="pageTitle">Historique</h2><p class="pageSub">Toutes les opérations traitées, de la plus récente à la plus ancienne.</p><div id="responsibleHistoryBox"><div class="empty">Chargement...</div></div></div>`;
  const d=responsibleDashboardData || await (async()=>{const email=currentResponsible.email||'';const [r,c]=await Promise.all([supabaseRpc('responsable_recovery_v2',{p_email:email}),supabaseRpc('responsable_declarations_all_v1',{p_email:email})]);return {...r,declarations:(Array.isArray(c?.declarations)?c.declarations:[]).map(x=>({...x,employeeName:x.employee_name||x.employee_email||'Employé',employeeEmail:x.employee_email||'',weekStart:x.week_from||'',weekEnd:x.week_to||'',timeFrom:x.time_from||'',timeTo:x.time_to||'',holidayName:x.holiday_name||''}))};})();
  responsibleDashboardData=d;

  const declarations=(Array.isArray(d?.declarations)?d.declarations:[])
    .filter(x=>responsibleApprovedStatus(x.status)||responsibleRejectedStatus(x.status))
    .map(x=>({kind:'declaration',...x}));
  const requests=(Array.isArray(d?.requests)?d.requests:[])
    .filter(x=>responsibleApprovedStatus(x.status)||responsibleRejectedStatus(x.status))
    .map(x=>({kind:'demande',...x}));

  const rows=[...declarations,...requests].sort((a,b)=>{
    const ta=responsibleOperationTimestamp(a),tb=responsibleOperationTimestamp(b);
    if(ta!==tb)return tb-ta;
    return responsibleDateValue(b.date)-responsibleDateValue(a.date);
  });

  const box=document.getElementById('responsibleHistoryBox');
  if(!rows.length){box.innerHTML='<div class="empty">Aucune opération traitée.</div>';return}

  box.innerHTML=rows.map(x=>{
    const approved=responsibleApprovedStatus(x.status);
    const operationTs=responsibleOperationTimestamp(x);
    const operationText=operationTs?new Date(operationTs).toLocaleString('fr-FR'):'';
    const dateText=x.kind==='demande'?formatHolidayList(x.dates,x.holidayNames):formatHolidayCard(x.date,x.holidayName);
    return `<div class="responsableResult">
      <div class="resultHead">
        <div><div class="resultName">${esc(x.employeeName||x.employeeEmail||'Employé')}</div><div class="resultMeta">${esc(x.service||'')} · ${esc(x.rayon||'')}</div></div>
        <span class="badge ${approved?'approved':'rejected'}">${esc(x.status||'')}</span>
      </div>
      <div class="typeBadge">${x.kind==='demande'?'DEMANDE':'DÉCLARATION'}</div>
      <div class="resultDate">${dateText}</div>
      <div class="resultInfo">${operationText?'Date opération : '+esc(operationText)+' · ':''}${x.kind==='demande'?formatRecoveryDays(x.daysCount)+' jour(s)':esc(x.type||'Déclaration')}</div>
    </div>`;
  }).join('');
}

async function processDeclaration(id,status){
  const card=document.querySelector(`[data-declaration-id="${CSS.escape(String(id))}"]`);
  try{
    await supabaseRpc('process_responsable_declaration_v1',{p_email:currentResponsible.email||'',p_declaration_id:id,p_status:status});
    if(card)card.remove();

    // Met à jour immédiatement le compteur local des déclarations en attente,
    // comme pour les demandes, avant le prochain retour au dashboard.
    if(responsibleDashboardSnapshot?.stats){
      const currentPending=Number(responsibleDashboardSnapshot.stats.pending||0)||0;
      responsibleDashboardSnapshot.stats.pending=Math.max(0,currentPending-1);
      const requests=Array.isArray(responsibleDashboardData?.requests)?responsibleDashboardData.requests:[];
      const currentRecoveryPending=requests.length
        ? requests.filter(x=>String(x?.status||'').trim().toUpperCase()==='EN ATTENTE').length
        : Number(responsibleDashboardSnapshot.stats.recoveryPending||0)||0;
      responsibleDashboardSnapshot.stats.recoveryPending=currentRecoveryPending;
      saveDashboardSnapshot('GESTION_RESPONSIBLE_DASHBOARD_'+String(currentResponsible.email||'').toLowerCase(),responsibleDashboardSnapshot);
    }
    responsibleDashboardData=null;
    if(!document.querySelector('[data-declaration-id]')){
      const box=document.getElementById('declarationList');
      if(box)box.innerHTML='<div class="empty">Aucune déclaration dans cette rubrique.</div>';
    }
    showOperationToast(status==='APPROUVÉ' || status==='APPROUVE' ? 'Déclaration validée avec succès' : 'Déclaration traitée avec succès');
  }catch(e){
    if(/déclaration.*déjà.*traitée|declaration.*deja.*traitee/i.test(String(e?.message||''))){
      if(card)card.remove();
      return;
    }
    alert(e.message||e);
  }
}

async function processRecovery(id,status){
  const card=document.querySelector(`[data-request-id="${CSS.escape(String(id))}"]`);
  try{
    await api('processRecoveryRequest',{email:String(currentResponsible?.email||'').trim().toLowerCase(),requestId:id,status});
    if(card)card.remove();
    responsibleDashboardData=null;
    const remainingPendingRequests=document.querySelectorAll('[data-request-id]').length;
    const cachedResponsible=responsibleDashboardSnapshot||readDashboardSnapshot('GESTION_RESPONSIBLE_DASHBOARD_'+String(currentResponsible.email||'').toLowerCase())||{};
    const cachedStats={...(cachedResponsible.stats||{}),recoveryPending:remainingPendingRequests};
    responsibleDashboardSnapshot={...cachedResponsible,stats:cachedStats};
    saveDashboardSnapshot('GESTION_RESPONSIBLE_DASHBOARD_'+String(currentResponsible.email||'').toLowerCase(),responsibleDashboardSnapshot);
    if(!document.querySelector('[data-request-id]')){
      const box=document.getElementById('respList');
      if(box)box.innerHTML='<div class="empty">Aucune demande dans cette rubrique.</div>';
    }
    showOperationToast(status==='APPROUVÉ' || status==='APPROUVE' ? 'Demande validée avec succès' : 'Demande traitée avec succès');
  }catch(e){
    if(/demande.*déjà.*traitée|demande.*deja.*traitee/i.test(String(e?.message||''))){
      if(card)card.remove();
      return;
    }
    alert(e.message||e);
  }
}

/* Mot de passe oublié — Supabase فقط */
function forgot(){
  app.innerHTML=`
    <div class="card">
      <button class="back" onclick="home()">Retour</button>
      <h2>Mot de passe oublié</h2>
      <div id="msg"></div>

      <label>EMAIL</label>
      <input id="email" type="email" autocomplete="email">

      <button id="resetSendBtn" class="btn" onclick="sendReset()">Envoyer le code</button>
    </div>`;
}

async function sendReset(){
  const b=document.getElementById('resetSendBtn')||document.getElementById('resendBtn');
  try{
    pendingEmail=(val('email')||pendingEmail||'').toLowerCase().trim();
    if(!pendingEmail)throw new Error('Veuillez saisir votre adresse email.');
    setBusy(b,true,'Vérification...');

    // EMPLOYÉ : récupération directe sans code OTP, via la même Edge Function
    // que la création du compte employé. RESPONSABLE : OTP inchangé.
    const {data:employeeCheck,error:employeeCheckError}=await supabaseClient.functions.invoke('reset-employee-password',{
      body:{action:'check_employee',email:pendingEmail}
    });
    if(employeeCheckError)throw employeeCheckError;

    if(employeeCheck?.is_employee===true){
      resetCodeVerified=true;
      resetStep2();
      return;
    }

    // RESPONSABLE : flux OTP existant inchangé.
    const {error}=await supabaseClient.auth.signInWithOtp({
      email:pendingEmail,
      options:{shouldCreateUser:false}
    });
    if(error)throw error;

    resetCodeVerified=false;
    showOperationToast('Code de vérification envoyé avec succès');
    codeForm('RESET');
  }catch(e){err(e)}
  finally{setBusy(b,false)}
}

async function verifyResetCode(){
  const b=document.getElementById('verifyBtn'),c=getCode();
  if(c.length!==6){const x=document.getElementById('msg');if(x)x.innerHTML='<div class="error">⚠️ أدخل رمز التحقق المكون من 6 أرقام.</div>';return;}
  try{
    setBusy(b,true,'Vérification...');
    const {data,error}=await supabaseClient.auth.verifyOtp({email:pendingEmail,token:c,type:'email'});
    if(error)throw error;
    if(!data?.session)throw new Error('Session Supabase absente après vérification.');
    resetCodeVerified=true;
    resetStep2();
  }catch(e){err(e)}
  finally{setBusy(b,false)}
}

function resetStep2(){
  if(!resetCodeVerified)return;
  app.innerHTML=`<div class="card"><button class="back" onclick="codeForm('RESET')">Retour</button><h2>Nouveau mot de passe</h2><p class="muted">Code vérifié avec succès.</p><div id="msg"></div><label>NOUVEAU MOT DE PASSE</label><input id="newpass" type="password" inputmode="numeric" autocomplete="new-password"><label>CONFIRMER LE MOT DE PASSE</label><input id="newpass2" type="password" inputmode="numeric" autocomplete="new-password"><button id="finishResetBtn" class="btn" onclick="finishReset()">Modifier le mot de passe</button></div>`;
}

async function finishReset(){
  if(!resetCodeVerified)throw new Error('La procédure de récupération doit être validée avant de changer le mot de passe.');
  const p1=val('newpass'),p2=val('newpass2');
  if(!p1||p1.length<6){err(new Error('Le mot de passe doit contenir au moins 6 caractères.'));return;}
  if(p1!==p2){err(new Error('Les deux mots de passe ne correspondent pas.'));return;}
  const b=document.getElementById('finishResetBtn');
  try{
    setBusy(b,true,'Modification...');
    const resetEmail=String(pendingEmail||'').trim().toLowerCase();

    // EMPLOYÉ : changement direct via la même Edge Function create-employee.
    const {data:employeeCheck,error:employeeCheckError}=await supabaseClient.functions.invoke('reset-employee-password',{
      body:{action:'check_employee',email:resetEmail}
    });
    if(employeeCheckError)throw employeeCheckError;

    if(employeeCheck?.is_employee===true){
      const {data,error}=await supabaseClient.functions.invoke('reset-employee-password',{
        body:{action:'reset_employee_password',email:resetEmail,password:p1}
      });
      if(error)throw error;
      if(!data?.ok)throw new Error(data?.error||'Impossible de modifier le mot de passe.');
      resetCodeVerified=false;
      pendingEmail='';
      app.innerHTML=`<div class="card"><h2>✅ Mot de passe modifié</h2><p>Votre mot de passe employé a été modifié avec succès dans Supabase.</p><button class="btn" onclick="loginForm()">Se connecter</button></div>`;
      return;
    }

    // RESPONSABLE : session OTP existante + updateUser inchangé.
    const authEmail=await getAuthEmailForPasswordSync();
    if(!resetEmail || authEmail!==resetEmail){
      throw new Error('COMPTE_SESSION_INCORRECT : la session Supabase ne correspond pas au compte en récupération.');
    }

    const {error}=await supabaseClient.auth.updateUser({password:p1});
    if(error)throw error;
    await supabaseAuthRpc('sync_password_profile_v1',{p_email:authEmail,p_password:p1});

    await supabaseClient.auth.signOut();
    resetCodeVerified=false;
    showOperationToast('Mot de passe modifié avec succès');
    app.innerHTML=`<div class="card"><h2>✅ Mot de passe modifié</h2><p>Votre mot de passe a été modifié avec succès dans Supabase.</p><button class="btn" onclick="loginForm()">Se connecter</button></div>`;
  }catch(e){err(e)}
  finally{setBusy(b,false)}
}

home();
